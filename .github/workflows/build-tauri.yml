name: Release Tauri Desktop App & Auto-Updater

on:
  push:
    branches:
      - tauri
      - tauri-dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Desktop Application/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'Desktop Application/src-tauri -> target'

      - name: Install dependencies
        working-directory: './Desktop Application'
        run: npm install

      - name: Build & Publish Tauri App (With Updater Signatures)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './Desktop Application'
          tagName: v__VERSION__
          releaseName: '26AS Desktop Portal v__VERSION__'
          releaseBody: 'Automated release with auto-updater binaries.'
          releaseDraft: false
          prerelease: false
